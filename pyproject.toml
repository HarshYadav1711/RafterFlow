[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rafterflow"
version = "0.1.0"
description = "Bounded AI lead-intake backend for Summit Roofing Co. (assessment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "SQLAlchemy>=2.0.36,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "httpx>=0.27.0,<1.0",
  "openai>=1.50.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
